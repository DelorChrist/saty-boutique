<header class="main-header">
  <div class="main-header__inner">
    <!-- Zone gauche : burger + logo -->
    <div class="header-left">
      <!-- Bouton Catégories (burger) -->
      <div class="header-dropdown">
        <button type="button" class="header-btn" (click)="toggleCategories()" aria-haspopup="true"
          [attr.aria-expanded]="showCategories">
          <svg class="header-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>

        <!-- Dropdown Catégories -->
        <div class="dropdown dropdown--categories" *ngIf="showCategories" role="menu">
          <button *ngFor="let cat of categories" type="button" (click)="goToCategory(cat.slug)" role="menuitem">
            <img [src]="getCategoryIcon(cat.slug)" [alt]="cat.name" class="dropdown__icon" />
            <span>{{ cat.name }}</span>
          </button>
        </div>
      </div>

      <!-- Logo -->
      <a routerLink="/" class="logo">
        Saty<span>Boutique</span>
      </a>
    </div>

    <!-- Zone centrale : recherche avec suggestions -->
    <div class="header-center">
      <form class="search-bar" (ngSubmit)="onSearch()" role="search">
        <div class="search-bar__inner">
          <img src="assets/icons/search.svg" alt="" class="search-bar__icon" />
          <input type="text" placeholder="Rechercher un article..." [(ngModel)]="searchQuery" (input)="onSearchInput()"
            name="search" aria-label="Rechercher un article" autocomplete="off" />
        </div>
        <button type="submit" class="search-bar__button">
          Rechercher
        </button>

        <!-- 🎯 SUGGESTIONS EN TEMPS RÉEL -->
        <div class="suggestions" *ngIf="showSuggestions && suggestions.length > 0">
          <div class="suggestion-item" *ngFor="let product of suggestions"
            (click)="goToProductFromSuggestion(product.id)">
            <img [src]="product.image" [alt]="product.name" class="suggestion-item__image" />
            <div class="suggestion-item__info">
              <p class="suggestion-item__name">{{ product.name }}</p>
              <p class="suggestion-item__price">
                {{ product.price | number }} FCFA
              </p>
            </div>
          </div>

          <div class="suggestions__footer" *ngIf="suggestions.length >= 5">
            <button type="button" class="suggestions__see-all" (click)="onSearch()">
              Voir tous les résultats →
            </button>
          </div>
        </div>
      </form>
    </div>

    <!-- Zone droite : compte / aide / panier -->
    <div class="header-right">
      <!-- Compte -->
      <div class="header-dropdown">
        <button type="button" class="header-btn" (click)="toggleAccountMenu()" aria-haspopup="true"
          [attr.aria-expanded]="showAccountMenu">
          <img src="assets/icons/user.svg" alt="" class="header-btn__icon" />
          <span *ngIf="!isAuthenticated">Se connecter</span>
          <span *ngIf="isAuthenticated">Bonjour, {{ greetingName }}</span>
          <img src="assets/icons/chevron-down.svg" alt="" class="header-btn__chevron" />
        </button>

        <div class="dropdown" *ngIf="showAccountMenu" role="menu">
          <!-- Bouton rouge du haut -->
          <button type="button" class="dropdown__login-btn connexion" (click)="onAccountMainClick()" role="menuitem"
            *ngIf="!isAuthenticated">
            Se connecter
          </button>

          <hr class="dropdown__divider" />

          <button type="button" (click)="goToAccount()" role="menuitem">
            <img src="assets/icons/account.svg" alt="" class="dropdown__icon" />
            <span>Mon compte</span>
          </button>

          <button type="button" (click)="goToOrders()" role="menuitem">
            <img src="assets/icons/orders.svg" alt="" class="dropdown__icon" />
            <span>Mes commandes</span>
          </button>

          <button type="button" (click)="goToInbox()" role="menuitem">
            <img src="assets/icons/boite.png" alt="" class="dropdown__icon" />
            <span>Boîte de réception</span>
            <span class="notification-badge" *ngIf="(inboxService.unreadCount$ | async) as count">
              {{ count > 99 ? '99+' : count }}
            </span>
          </button>

          <button type="button" (click)="goToFavorites()" role="menuitem">
            <img src="assets/icons/favorite.svg" alt="" class="dropdown__icon" />
            <span>Favoris ({{ favoritesService.getTotalItems() }})</span>
          </button>

          <button type="button" (click)="goToVouchers()" role="menuitem">
            <img src="assets/icons/bon.png" alt="" class="dropdown__icon" />
            <span>Bons d'achats</span>
          </button>

          <!-- Bouton rouge Se déconnecter en bas -->
          <hr class="dropdown__divider" *ngIf="isAuthenticated" />
          <button type="button" class="dropdown__login-btn deconnexion" role="menuitem" *ngIf="isAuthenticated"
            (click)="logout()">
            Se déconnecter
          </button>
        </div>
      </div>

      <!-- Aide -->
      <div class="header-dropdown">
        <button type="button" class="header-btn" (click)="toggleHelpMenu()" aria-haspopup="true"
          [attr.aria-expanded]="showHelpMenu">
          <img src="assets/icons/help.svg" alt="" class="header-btn__icon" />
          <span>Aide</span>
          <img src="assets/icons/chevron-down.svg" alt="" class="header-btn__chevron" />
        </button>

        <div class="dropdown" *ngIf="showHelpMenu" role="menu">
          <button type="button" role="menuitem" (click)="goToCentreAssistance()">
            <span>Centre d'assistance</span>
          </button>
          <button type="button" role="menuitem" (click)="goToCommentCommander()">
            <span>Comment commander</span>
          </button>
          <button type="button" role="menuitem" (click)="goToCommentPayer()">
            <span>Comment payer</span>
          </button>
          <button type="button" role="menuitem" (click)="goToBoutiqueCocody()">
            <span>Retrouver la boutique (Cocody)</span>
          </button>

          <div class="help-actions">
            <button type="button" class="help-btn help-btn--whatsapp" (click)="openWhatsApp()"
              aria-label="Contacter la boutique sur WhatsApp">
              <img src="assets/icons/whatsapp.svg" alt="" class="help-btn__icon" aria-hidden="true" />
              <span>WhatsApp</span>
            </button>

            <button type="button" class="help-btn help-btn--livechat" (click)="openLiveChat()"
              aria-label="Ouvrir le chat en direct">
              <span>Chat en direct</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Panier avec badge -->
      <button type="button" class="header-btn header-btn--cart" (click)="goToCart()" aria-label="Voir le panier">
        <img src="assets/icons/cart.svg" alt="" class="header-btn__icon" />
        <span>Panier</span>

        <!-- Badge uniquement si connecté ET panier > 0 -->
        <span class="header-badge" *ngIf="isAuthenticated && cartService.getTotalItems() > 0">
          {{ cartService.getTotalItems() }}
        </span>
      </button>
    </div>
  </div>
</header>
